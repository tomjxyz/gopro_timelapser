name: Build Windows exe

# Legacy Windows build: only runs when the Windows app changes.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["src/**", "build.ps1", ".github/workflows/build.yml"]
  pull_request:
    paths: ["src/**", "build.ps1", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # windows-latest already ships the .NET 8 SDK
      - name: .NET info
        run: dotnet --list-sdks

      - name: Build
        shell: pwsh
        run: ./build.ps1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: GoProTimelapser
          path: publish/GoProTimelapser.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/GoProTimelapser.exe
