name: Build Mac app

on:
  push:
    branches: ["**"]
    tags: ["mac-v*"]
    paths: ["mac/**", ".github/workflows/mac.yml"]
  pull_request:
    paths: ["mac/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test (Apple Silicon)
        run: swift test

      - name: Test (Intel, under Rosetta)
        run: swift test --arch x86_64

      - name: Build universal app
        run: |
          VERSION=1.0.0
          if [[ "$GITHUB_REF" == refs/tags/mac-v* ]]; then VERSION="${GITHUB_REF#refs/tags/mac-v}"; fi
          VERSION="$VERSION" ./scripts/bundle.sh

      - name: Screenshots
        continue-on-error: true
        run: |
          mkdir -p build/shots build/clips
          GPT_SCREENSHOT_DIR="$PWD/build/clips" swift test --filter testWriteScreenshotClips
          BIN="build/GoPro Timelapser.app/Contents/MacOS/GoProTimelapser"
          for tab in timelapse join; do
            GPT_TAB=$tab "$BIN" "$PWD/build/clips" &
            PID=$!
            sleep 8
            screencapture -x "build/shots/$tab.png"
            kill $PID || true
            sleep 1
          done
          ls -la build/shots

      - uses: actions/upload-artifact@v4
        with:
          name: GoPro-Timelapser-mac
          path: mac/build/GoPro-Timelapser-mac.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: mac/build/shots/*.png
          if-no-files-found: ignore

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/mac-v')
        uses: softprops/action-gh-release@v2
        with:
          files: mac/build/GoPro-Timelapser-mac.zip
