name: Build Mac app

on:
  push:
    branches: ["**"]
    tags: ["mac-v*"]
    paths: ["mac/**", ".github/workflows/mac.yml"]
  pull_request:
    paths: ["mac/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

permissions:
  contents: write

# A new push cancels the previous run on the same branch.
concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test (Apple Silicon)
        timeout-minutes: 6
        # Run under a pseudo-terminal so test output streams live instead of arriving at the end.
        run: |
          script -q /dev/null bash -c 'swift test; echo $? > "$RUNNER_TEMP/rc"'
          exit "$(cat "$RUNNER_TEMP/rc")"

      - name: Test (Intel, under Rosetta)
        timeout-minutes: 8
        # Build the Intel test bundle, then run Xcode's (universal) test runner under Rosetta.
        run: |
          swift build --build-tests --arch x86_64
          BUNDLE="$(swift build --build-tests --arch x86_64 --show-bin-path)/GoProTimelapserPackageTests.xctest"
          script -q /dev/null bash -c "arch -x86_64 xcrun xctest '$BUNDLE'; echo \$? > '$RUNNER_TEMP/rc'"
          exit "$(cat "$RUNNER_TEMP/rc")"

      - name: Build universal app
        run: |
          VERSION=1.0.0
          if [[ "$GITHUB_REF" == refs/tags/mac-v* ]]; then VERSION="${GITHUB_REF#refs/tags/mac-v}"; fi
          VERSION="$VERSION" ./scripts/bundle.sh

      - name: Screenshots
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p build/shots build/clips
          GPT_SCREENSHOT_DIR="$PWD/build/clips" swift test --filter testWriteScreenshotClips > /dev/null

          # Debug build first: on a crash Swift prints the exact error and source line.
          swift build 2>&1 | tail -1
          echo "::group::Debug launch"
          (.build/debug/GoProTimelapser "$PWD/build/clips" > build/debug-app.log 2>&1 &) ; sleep 8
          pkill -f .build/debug/GoProTimelapser || true
          cat build/debug-app.log
          echo "::endgroup::"

          BIN="build/GoPro Timelapser.app/Contents/MacOS/GoProTimelapser"
          for tab in timelapse join; do
            GPT_TAB=$tab "$BIN" "$PWD/build/clips" > "build/app-$tab.log" 2>&1 &
            PID=$!
            sleep 8
            screencapture -x "build/shots/$tab.png"
            if kill -0 $PID 2>/dev/null; then echo "$tab: app still running (good)"; kill $PID; else echo "$tab: APP EXITED/CRASHED"; fi
            cat "build/app-$tab.log"
            sleep 1
          done

          # Crash report backtrace, if any.
          REPORT="$(ls -t ~/Library/Logs/DiagnosticReports/GoProTimelapser* 2>/dev/null | head -1 || true)"
          if [ -n "$REPORT" ]; then
            echo "::group::Crash report $REPORT"
            python3 - "$REPORT" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          header, _, body = text.partition("\n")
          r = json.loads(body)
          print("exception:", r.get("exception"), r.get("termination", {}).get("indicator"))
          t = r["threads"][r["faultingThread"]]
          imgs = r.get("usedImages", [])
          for f in t["frames"][:25]:
              img = imgs[f["imageIndex"]].get("name", "?") if f.get("imageIndex") is not None else "?"
              print(f"  {img:28} {f.get('symbol', '?')}  +{f.get('symbolLocation', f.get('imageOffset'))}  {f.get('sourceFile', '')}:{f.get('sourceLine', '')}")
          PY
            echo "::endgroup::"
          fi

          # Small JPEG copies of the screenshots, base64 in the log so they can be viewed without downloading.
          for tab in timelapse join; do
            [ -f "build/shots/$tab.png" ] || continue
            sips -Z 1200 -s format jpeg -s formatOptions 70 "build/shots/$tab.png" --out "build/shots/$tab-small.jpg" > /dev/null
            echo "BEGIN-SHOT $tab"; base64 -b 120 -i "build/shots/$tab-small.jpg"; echo "END-SHOT $tab"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: GoPro-Timelapser-mac
          path: mac/build/GoPro-Timelapser-mac.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: mac/build/shots/*.png
          if-no-files-found: ignore

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/mac-v')
        uses: softprops/action-gh-release@v2
        with:
          files: mac/build/GoPro-Timelapser-mac.zip
